services:

  user-service:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.docker.example
    ports:
      - "8081:8081"
    networks:
      - default
      - eureka-net
    depends_on:
      - user-postgres-db
      - user-redis


  user-postgres-db:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"

  user-redis:
    image: redis:8
    ports:
      - "6379:6379"

networks:
  eureka-net:
    external: true