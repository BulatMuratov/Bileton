server:
  port: 8082


spring:
  application:
    name: payment-service

  datasource:
    url: ${PAYMENT_DATASOURCE_URL}
    username: ${PAYMENT_DB_USER}
    password: ${PAYMENT_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate

  liquibase:
    enabled: true
    change-log: db/changelog/db.changelog-master.xml

#  security:
#    oauth2:
#      resourceserver:
jwt:
  public-key-path: classpath:keys/public_key.pem


eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
