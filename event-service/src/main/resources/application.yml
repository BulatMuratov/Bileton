server:
  port: 8082
  tomcat:
    accept-count: 10
    max-connections: 20
    threads:
      max: 10
      min-spare: 2


spring:
  application:
    name: event-service

  datasource:
    url: ${EVENT_DATASOURCE_URL}
    username: ${EVENT_DB_USER}
    password: ${EVENT_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate

  liquibase:
    enabled: true
    change-log: db/changelog/db.changelog-master.xml

#  security:
#    oauth2:
#      resourceserver:
jwt:
  public-key-path: classpath:keys/public_key.pem


eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
