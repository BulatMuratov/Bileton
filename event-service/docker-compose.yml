services:

  event-service:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.docker.example
    ports:
      - "8082:8082"
    networks:
      - default
      - eureka-net
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka-1:19092,kafka-2:19092,kafka-3:19092
    depends_on:
      - event-postgres-db

  event-postgres-db:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5434:5432"

networks:
  eureka-net:
    external: true
