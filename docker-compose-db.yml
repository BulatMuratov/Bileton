version: '3.8'

services:
  postgres-user:
    image: postgres:18
    container_name: user-postgres-db
    environment:
      POSTGRES_USER: ${USER_DB_USER}
      POSTGRES_PASSWORD: ${USER_DB_PASSWORD}
      POSTGRES_DB: ${USER_DB_NAME}
    ports:
      - "5433:5432"

    deploy:
      resources:
        limits:
          memory: 400M

  postgres-event:
    image: postgres:18
    container_name: event-postgres-db
    environment:
      POSTGRES_USER: ${EVENT_DB_USER}
      POSTGRES_PASSWORD: ${EVENT_DB_PASSWORD}
      POSTGRES_DB: ${EVENT_DB_NAME}
    ports:
      - "5434:5432"

    deploy:
      resources:
        limits:
          memory: 400M

  postgres-booking:
    image: postgres:18
    container_name: booking-postgres-db
    environment:
      POSTGRES_USER: ${BOOKING_DB_USER}
      POSTGRES_PASSWORD: ${BOOKING_DB_PASSWORD}
      POSTGRES_DB: ${BOOKING_DB_NAME}
    ports:
      - "5435:5432"

    deploy:
      resources:
        limits:
          memory: 400M

  postgres-payments:
    image: postgres:18
    container_name: payment-postgres-db
    environment:
      POSTGRES_USER: ${PAYMENT_DB_USER}
      POSTGRES_PASSWORD: ${PAYMENT_DB_PASSWORD}
      POSTGRES_DB: ${PAYMENT_DB_NAME}
    ports:
      - "5436:5432"

    deploy:
      resources:
        limits:
          memory: 400M

  redis:
    image: redis:8
    container_name: user-redis-db
    command: >
      redis-server 
      --requirepass ${REDIS_PASSWORD:-redispass} 
      --appendonly yes 
      --notify-keyspace-events Ex
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"