  kafka-init:
    image: apache/kafka:4.1.2
    container_name: kafka-init

    depends_on:
      - kafka-1
      - kafka-2
      - kafka-3

    volumes:
      - ./create-topics.sh:/create-topics.sh:ro

    entrypoint:
      - /bin/bash
      - /create-topics.sh


volumes:
  kafka-1-data:
  kafka-2-data:
  kafka-3-data: