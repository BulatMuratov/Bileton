server:
  port: 8083

spring:
  application:
    name: booking-service

  datasource:
    url: ${BOOKING_DATASOURCE_URL}
    username: ${BOOKING_DB_USER}
    password: ${BOOKING_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate

  liquibase:
    enabled: true
    change-log: db/changelog/db.changelog-master.xml

jwt:
  public-key-path: classpath:keys/public_key.pem


eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
