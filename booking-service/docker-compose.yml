services:

  booking-service:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.docker
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka-1:19092,kafka-2:19092,kafka-3:19092
    ports:
      - "8083:8083"
    networks:
      - default
      - eureka-net
      - kafka-net
    depends_on:
      - booking-postgres-db
      - booking-redis


  booking-postgres-db:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5437:5432"

  booking-redis:
    image: redis:8
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-redispass}
      --appendonly yes
      --notify-keyspace-events Ex
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru

networks:
  eureka-net:
    external: true
  kafka-net:
    external: true